<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido - Pizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🍕 Pizzaria</h1>
            <p>Faça seu pedido online</p>
        </header>

        <form id="pedidoForm">

            <!-- Dados do cliente -->
            <section class="card">
                <h2>👤 Seus dados</h2>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="whatsapp">WhatsApp</label>
                    <input
                        type="tel"
                        id="whatsapp"
                        name="whatsapp"
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@email.com"
                    >
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <textarea
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, número, bairro e complemento"
                        required
                    ></textarea>
                </div>
            </section>

            <!-- Pizza -->
            <section class="card">
                <h2>🍕 Escolha sua pizza</h2>

                <div class="campo">
                    <label for="pizza">Sabor</label>

                    <select id="pizza" name="pizza" required>
                        <option value="">Selecione um sabor</option>
                        <option value="Calabresa">Calabresa - R$ 35,00</option>
                        <option value="Mussarela">Mussarela - R$ 32,00</option>
                        <option value="Frango com Catupiry">
                            Frango com Catupiry - R$ 40,00
                        </option>
                        <option value="Portuguesa">
                            Portuguesa - R$ 38,00
                        </option>
                        <option value="Quatro Queijos">
                            Quatro Queijos - R$ 42,00
                        </option>
                    </select>
                </div>


                 <div class="campo">
                    <label for="pizza">Borda</label>

                    <select id="borda" name="borda" required>
                        <option value="">Selecione um recheio de borda</option>
                        <option value="Cheddar">Cheddar - R$ 3,00</option>
                        <option value="Catupiry">Catupiry - R$ 3,00</option>
                        <option value="Chocolate">Chocolate - R$ 4,00 </option>
                    </select>
                </div>

                <div class="campo">
                    <label for="tamanho">Tamanho</label>

                    <select id="tamanho" name="tamanho" required>
                        <option value="">Selecione o tamanho</option>
                        <option value="Pequena">Pequena</option>
                        <option value="Média">Média</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>

                    <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        value="1"
                        min="1"
                        max="20"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="observacao">Observação</label>

                    <textarea
                        id="observacao"
                        name="observacao"
                        placeholder="Ex: Sem cebola, pouco sal..."
                    ></textarea>
                </div>
            </section>

            <!-- Pagamento -->
            <section class="card">
                <h2>💳 Pagamento</h2>

                <div class="pagamento">

                    <label>
                        <input
                            type="radio"
                            name="pagamento"
                            value="Pix"
                            required
                        >
                        Pix
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="pagamento"
                            value="Cartão"
                        >
                        Cartão
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="pagamento"
                            value="Dinheiro"
                        >
                        Dinheiro
                    </label>

                </div>
            </section>

            <!-- Total -->
            <section class="total">
                <span>Total do pedido:</span>
                <strong id="total">R$ 0,00</strong>
            </section>

            <button type="submit" class="btn-pedido">
                Fazer Pedido 🍕
            </button>

        </form>

        <div id="mensagem"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
